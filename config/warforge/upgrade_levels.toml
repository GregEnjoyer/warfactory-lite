# WarForge citadel progression — balanced around GregTech (GTCEu) tier progression.
#
# Factions start at level 0 (free) and spend the listed materials at their citadel to
# reach each subsequent level, unlocking more claims / force-loaded chunks / insurance
# slots / FOBs.
#
# Layout: 6 GT tiers x 3 levels each (Steam, LV, MV, HV, EV, IV) = levels 1..18.
#   * "increasing amount of the tier's components": the tier's plate count scales 8 -> 16 -> 24
#     across the three levels of that tier.
#   * Circuit gate per level within a tier: L1 uses the PREVIOUS voltage circuit, L2 the
#     CURRENT tier circuit, L3 the NEXT tier circuit (so the third level of a tier forces you
#     to have already reached into the tier above).
#   * Steam is the pre-electric base tier: plates only, no circuits. Every tier above Steam
#     adds its 8 plates + 8 circuits of the current tier as the per-level base unit.
#
# Caps reached at the top level (18): claim_limit 75, max_fobs 4, fob_ticket_limit 25,
# insurance_slots 64. claim_limit is validated to never decrease between levels.
#
# Requirement entry: { type = "ore", id = "<item tag>", count = N }  (tag match, e.g. circuits)
#                    { type = "item", id = "<item id>",  count = N }  (exact item, e.g. plates)

# ── Base ─────────────────────────────────────────────────────────────────────────────────
[[levels]]
level = 0
claim_limit = 5
insurance_slots = 0
loaded_chunks = 4
fob_ticket_limit = 5
fob_ticket_regen = 1
max_fobs = 0
extra_claim_cost = []
requirements = []

