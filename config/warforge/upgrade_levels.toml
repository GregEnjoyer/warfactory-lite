# WarForge citadel progression — balanced around GregTech (GTCEu) tier progression.
#
# Factions start at level 0 (free) and spend the listed materials at their citadel to
# reach each subsequent level, unlocking more claims / force-loaded chunks / insurance
# slots / FOBs.
#
# Layout: 6 GT tiers x 3 levels each (Steam, LV, MV, HV, EV, IV) = levels 1..18.
#   * "increasing amount of the tier's components": plate count scales 8 -> 16 -> 24, and the
#     GT machine components (robot arms / conveyors / sensors / field generators) scale up
#     across the three levels of each tier.
#   * Circuit gate per level within a tier: L1 uses the PREVIOUS voltage circuit, L2 the
#     CURRENT tier circuit, L3 the NEXT tier circuit (so the 3rd level of a tier forces you
#     into the tier above).
#   * Components: robot arm + conveyor from LV up; sensor added from HV up; field generator
#     added from EV up. Steam is pre-electric — plates only.
#
# extra_claim_cost = materials consumed each time a new claim block is placed at that level.
#   It ramps with tier ("bigger factories pay more per claim"): a circuit of the faction's
#   current voltage tier, count rising HV+ (ULV/LV/MV x1, HV/EV x2, IV x3). Level 0 is free.
#
# Caps reached at the top level (18): claim_limit 75, max_fobs 4, fob_ticket_limit 25,
# insurance_slots 64. claim_limit is validated to never decrease between levels.
#
# Requirement / extra_claim_cost entry:
#   { type = "ore",  id = "<item tag>", count = N }  (tag match, e.g. gtceu:circuits/lv)
#   { type = "item", id = "<item id>",  count = N }  (exact item, e.g. gtceu:steel_plate)

# ── Base ─────────────────────────────────────────────────────────────────────────────────
