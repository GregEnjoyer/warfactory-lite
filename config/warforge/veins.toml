# WarFactory Lite vein configuration.
#
# Veins yield GregTech raw ore CHUNKS (gtceu:raw_<material>), the maceration input -- not ore blocks.
# All ids below are verified against gtceu-1.20.1-7.5.3 (raw_<mat>_block storage blocks exist for each).
# gtceu has no raw_iron/raw_copper/raw_gold (those defer to vanilla), so iron/copper/gold use minecraft:raw_*.
#
# Overworld-only: this pack disables the Nether/End, so there are no dims entries for them.
# Titanium, tungsten, platinum, uranium and naquadah are intentionally absent -- they come from the
# drill-deposit system (kubejs/.../wfcore_drill_deposits.js), not passive WarForge veins.
#
# Distance gradient (square/Chebyshev metric, block coordinates):
# - gradient_radius: veins fill [0, radius] and reach zero density at the edge; nothing generates beyond it.
#     Set to the pack's ~50k world border half-width (drill script R = 50000). If you actually run a 40k
#     border, change this to 40000.
# - gradient_frequency: falloff curve. 1.0 linear; >1.0 keeps the core dense with a gentle taper that only
#     thins near the border (outer stays very feasible); <1.0 pulls harder toward the center. 1.75 = dense
#     but not overwhelming core, viable all the way out, sparse only near the rim.
# - gradient_center_x / gradient_center_z: block coords of the center (world origin).
#
# Yields are the NORMAL (FAIR) amount. Quality auto-scales POOR 0.5x / FAIR 1.0x / RICH 2.0x,
# so a primary yield of 24 gives 12 / 24 / 48, and 6 gives 3 / 6 / 12.

iteration = 1
megachunk_length = 32
gradient_center_x = 0
gradient_center_z = 0
gradient_radius = 50000
gradient_frequency = 1.75

# ---------- Bulk industrial ores (primary yield 24 -> 12 / 24 / 48) ----------

[[veins]]
	id = 0
	key = "warforge.veins.iron"
	wealth = 1
	dims = [ { id = "minecraft:overworld", weight = 0.12 } ]
	components = [
		{ item = "minecraft:raw_iron", yield = 24.0 },
		{ item = "gtceu:raw_pyrite", yield = 6.0 },
