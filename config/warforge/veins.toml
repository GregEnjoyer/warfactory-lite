# [[veins]]
# key = "warforge.veins.iron_mix"
# wealth = 1
# quals = { RICH = 10.0, POOR = 0.1 }
# dims = [
#     { id = "minecraft:the_nether", weight = 0.5, mult = 2.0 },
#     { id = "minecraft:overworld", weight = 0.4215 },
#     { id = "minecraft:the_end", weight = 1.0 },
# ]
# components = [
#     { item = "minecraft:iron_ore", yield = 2.0, weights = [ { id = "minecraft:the_nether", weight = 0.75 }, { id = "minecraft:overworld", weight = 1.0 } ] },
#     { item = "minecraft:coal_ore", yield = 1.0, mults = [ { id = "minecraft:the_nether", mult = 4.0 } ] },
# ]
#...
# -----------------------------------------------------------------------------------------------
# LIVE CONFIG -- Overworld-only vein set (this pack has no Nether/End access: disableNether = true
# in config/wfcore.toml, so there is deliberately no [[veins]].dims entry for those dimensions).
#
# Tiered to match the rarity model already established for this pack's other GT resource systems
# (kubejs/startup_scripts/wfcore_drill_deposits.js and warforge-common.toml's "Valuable Blocks"):
# common industrial ores get high `weight` / low `wealth`; precious and endgame materials get the
# opposite. `weight` is relative, not a fraction of 1.0 -- lower means rarer.
#
# megachunk_length = 32 chunks (512 blocks) per region; at a 50k-block world border that's roughly
# 195 regions per side. floor(32^2 * weight) is the guaranteed minimum per region, e.g. naquadah's
# 0.002 guarantees floor(1024 * 0.002) = 2 per region -- present but genuinely scarce.
# -----------------------------------------------------------------------------------------------
iteration = 0

