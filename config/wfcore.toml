#Forge energy produced per millibucket of fluid fuel consumed.
#Range: > 1
energyToFluidRatio = 10
#How often (in ticks) a fuelled vehicle tops up from its fluid tank.
#Range: > 1
refuelIntervalTicks = 20
#Empty every chest and fishing loot table by default; repopulate or whitelist via KubeJS (WFLoot).
clearStructureLoot = true
#Make the Nether inaccessible: nether portals never form and any travel to the_nether (portals, commands) is blocked.
disableNether = true
#Dev tool: numpad-driven live editor for animated-machine model offsets (see IAnimatedMachine). Off by default so the numpad bindings and HUD stay inert for normal players.
modelTransformDebugEnabled = false
#Per-vehicle fuel/storage overrides. One quoted entry per line, format:
#  "vehicleId; maxFuel=4000; fluids=fluidId=ratio,fluidId=ratio; storageSize=40; storageColumns=10"
#Every field after the id is optional. An entry only takes effect if it sets fluids or storageSize.
#storageSize switches the vehicle to WFCore's resizable ModularUI storage; storageColumns is the grid width (default 9).
#Example: "superbwarfare:example_vehicle; maxFuel=4000; fluids=minecraft:lava=1.0,minecraft:water=0.5; storageSize=40; storageColumns=10"
#Aircraft burn Jet Fuel only (production chain in kubejs chemicals.js). ratio = energy
#multiplier: 2.0 = 20 FE/mB given energyToFluidRatio=10. Tune the list/ratio freely.
vehicles = [
	"ashvehicle:f-4; fluids=gtceu:jet_fuel=2.0",
	"ashvehicle:f14; fluids=gtceu:jet_fuel=2.0",
	"ashvehicle:f_16; fluids=gtceu:jet_fuel=2.0",
	"ashvehicle:su-25; fluids=gtceu:jet_fuel=2.0",
	"ashvehicle:f_15; fluids=gtceu:jet_fuel=2.0"
]
#Vehicle ids that plough through and break cacti, wood logs and leaves as they drive.
#Example: ["superbwarfare:lav_150", "superbwarfare:truck"]
foliageBreakers = []

#Drillable bedrock deposits. defaultYield is the per-block yield range used when a deposit type (built-in or KubeJS) does not specify its own.
[deposits]
	#Range: > 1
	defaultYieldMin = 2000
	#Range: > 1
	defaultYieldMax = 8000

	#Ambient weighted scatter across the world. Turn scatter off to rely only on KubeJS nodes/regions. rarity is "1 in N chunks".
	[deposits.worldgen]
		enabled = true
		scatter = false
		#Range: > 1
		rarity = 24
		#Debug: log every deposit cluster placed by worldgen (type, size, position). Testing aid.
		logPlacements = false

#Off-thread long-range ballistics for TACZ bullets and Superb Warfare projectiles.
[ballistics]
	#Master switch. When off, projectiles are never handed to the off-thread ballistics engine and behave exactly as their own mod ships them.
	enabled = true
	#Log each virtual shell's lifecycle to the server log: leaving loaded chunks, impact position (and whether that chunk was loaded), deferred detonations, and expiries.
	debugLogging = false

#Client-side player ranks / vanity tags, downloaded from a remote JSON manifest (uuid -> rank).
#Ranks: ARTIST, SCRIPTER (chat/tab tag), PRESS (may play back replays), MODERATOR, ADMIN (both
#of the above), plus the fun tags MTNS and SUPEROBAMA (chat-text effects only).
[playerRanks]
	#Master switch. When off, no manifest is downloaded and no tags or replay gate apply.
	enabled = true
	#URL of the JSON rank manifest. Leave blank to disable downloads (cached data, if any, still loads).
	#Shape: { "ranks": { "<uuid>": "ADMIN", "<uuid>": ["ARTIST", "SUPEROBAMA"] } }.
	#UUIDs may be dashed or undashed; a value may be one rank or an array of ranks.
	manifestUrl = ""
	#How often (minutes) the manifest is re-downloaded after the initial fetch. 3-5 recommended.
	#Range: 1 ~ 1440
	refreshIntervalMinutes = 4
	#When true, replay playback requires a replay-granting rank (Press/Moderator/Admin).
	#Recording is never restricted. Fails open until a manifest has loaded at least once.
	replayRequiresRank = true
	#Show the vanity [Tag] before ranked players' chat messages.
	showChatTags = true
	#Show the vanity [Tag] before ranked players' names in the tab list.
	showTabTags = true

#Soft client-mod integrity audit. On join the server asks the client to hash its mods-folder jars and
#compares them to config/wfcore-modmanifest.json (fileName -> sha256, regenerated per pack build).
#Anything unknown or modified is FLAGGED (log + operator message + optional Discord webhook) but NEVER
#kicked - a newer build is plausible, so an admin reviews. Hard mod validation stays with the anticheat.
[clientModAudit]
	#Master switch. When off, no request is sent on join and inbound reports are ignored.
	enabled = true
	#Discord webhook URL for flag notifications. Leave blank to log + notify in-game operators only.
	webhookUrl = ""
	#How long (seconds) to wait for a client's mod report before flagging that it never arrived.
	#Range: 1 ~ 300
	reportTimeoutSeconds = 20
	#Also flag manifest jars a client did NOT report (stripped mods). Off by default to reduce noise.
	flagMissing = false

