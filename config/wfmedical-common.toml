
[physiology]
	#How often (in ticks) dirty players' physiology is recomputed. Lower = more responsive, higher = cheaper.
	#Range: 1 ~ 40
	updateIntervalTicks = 10
	#Baseline maximum health in hearts (1 heart = 2 health points).
	#Range: 1 ~ 512
	maxHealthHearts = 15
	#Total blood volume in millilitres.
	#Range: 100.0 ~ 100000.0
	maxBloodMl = 5000.0
	#Blood fraction (0..1) below which blood-loss penalties begin.
	#Range: 0.0 ~ 1.0
	bloodLowFraction = 0.6
	#Blood fraction (0..1) below which the player is critical.
	#Range: 0.0 ~ 1.0
	bloodCriticalFraction = 0.35
	#Pain (0..1) above which pain-shock penalties begin.
	#Range: 0.0 ~ 1.0
	painShockThreshold = 0.6
	#Fraction of total blood volume that, once LOST, kills the player outright (bleeding out totally). Default 0.40 = losing more than 40% of your blood is instantly fatal.
	#Range: 0.05 ~ 1.0
	bloodDeathLossFraction = 0.55
	#Fraction of total blood volume LOST at which blood loss starts contributing to the unconsciousness score. Between this and bloodDeathLossFraction (default 30%-40% loss) blood loss ramps that score from 0 to 1; combined with pain it can knock the player out.
	#Range: 0.0 ~ 1.0
	bloodUnconsciousLossFraction = 0.3
	#Perceived pain (0..1) above which pain begins contributing to the unconsciousness score. Severe pain past this point pushes the player toward passing out.
	#Range: 0.0 ~ 1.0
	painUnconsciousThreshold = 0.7
	#Weight of the pain factor in the unconsciousness score. The score is the SUM of an independent blood-loss factor (reaches 1.0 at bloodUnconsciousLossFraction) and a pain factor (reaches 1.0 at painUnconsciousThreshold, then scaled by this weight); reaching 1.0 total knocks the player out. 1.0 (default) = severe pain alone can down you; lower = pain only contributes toward a combined blood-loss + pain knockout.
	#Range: 0.0 ~ 4.0
	painUnconsciousWeight = 0.5
	#Fraction of total blood LOST above which walk/jump speed is penalised (ramping to the pain-speed floor at the death loss). Non-leg injuries and general pain never affect speed; only leg injuries and blood loss past this threshold do. Default 0.25 = 25% lost.
	#Range: 0.0 ~ 1.0
	bloodMovementPenaltyLossFraction = 0.25
	#Severity (0..1) at or below which an UNTREATED bleeding wound slowly clots and closes on its own (natural hemostasis). A more severe bleed cannot be stopped by the body alone and keeps bleeding (worsening) until treated. Default 0.30.
	#Range: 0.0 ~ 1.0
	bleedingSelfHealThreshold = 0.3
	#Severity reduction PER TICK applied to a self-clotting wound (one at or below the self-heal threshold). Small = the wound takes a long while to close. Default 0.0003.
	#Range: 0.0 ~ 1.0
	bleedingSelfHealRate = 0.0002
	#Real-time minutes for a full-severity fracture to knit and heal ON ITS OWN while untreated (a partial fracture heals proportionally faster). Splinting/treating it is faster. 0 = fractures never self-heal (they worsen until treated). Default 20.
	#Range: 0.0 ~ 600.0
	fractureSelfHealMinutes = 10.0

[features]
	#Master toggle for fracture trauma.
	enableFractures = true
	#Master toggle for bleeding / blood loss.
	enableBleeding = true
	#Master toggle for the pain system.
	enablePain = true
	#If true, lethal conditions render the player unconscious (bleed-out) instead of instant death.
	enableBleedout = true
	#Creative-mode players ignore medical penalties.
	effectImmuneInCreative = true
	#Master toggle for the injectable/opioid substance system (morphine, naloxone, ...).
	enableInjectables = true
	#If true, a heavy opioid overdose can trigger ASPHYXIA (respiratory depression): heavy movement constraint, weakness, no sprint/jump and a blur + heavy vignette, ending in a FATAL unconsciousness unless the drug is reversed (naloxone) or decays in time.
	enableAsphyxia = true
	#If true, going underwater with no air is handled as ASPHYXIA (drowning) instead of vanilla drowning damage: once your breath runs out you struggle, then pass out and DROWN TO DEATH unless you reach the surface in time. Vanilla drowning damage is suppressed.
	enableDrowningAsphyxia = true
	#If true, fully depleting the HEAD's health kills the player OUTRIGHT (bypasses bleed-out/downing). Default false -> a destroyed head downs the player.
	headDepletionInstakill = false
	#If true, fully depleting the TORSO's health kills the player OUTRIGHT (bypasses bleed-out/downing). Default false -> a destroyed torso downs the player.
	torsoDepletionInstakill = true
	#If true, a downed (unconscious / bleeding-out) player may HOLD the 'Give Up' key to die instantly and reach the respawn screen.
	enableGiveUp = true
	#How long (ticks) a downed player must HOLD the 'Give Up' key before dying (20 ticks = 1 second). Default 40 (2 seconds).
	#Range: 1 ~ 1200
	giveUpHoldTicks = 60

[balance]
	#Ticks a player may remain unconscious from bleeding out before dying.
	#Range: 20 ~ 72000
	bleedoutTicks = 2400
	#Hard cap on distinct trauma objects per limb; excess compatible trauma is merged.
	#Range: 1 ~ 64
	maxTraumaPerLimb = 8
	#Movement speed multiplier applied per fractured leg (1.0 = no penalty).
	#Range: 0.0 ~ 1.0
	legFractureSpeedMultiplier = 0.4
	#How much injectable drug load decays per tick (higher = shorter dosing window before it clears). Lower values make the drug 'stat' come-down outlast a stimulant's beneficial effect window. Default 0.00035.
	#Range: 0.0 ~ 1.0
	drugDecayPerTick = 5.0E-4
	#If true, a severe overdose (drug load >= overdoseLethalThreshold) drains health during the overdose unconsciousness.
	overdoseLethalEnabled = true
	#Drug load at/above which an overdose unconsciousness also causes a slow respiratory-depression health drain.
	#Range: 0.0 ~ 100.0
	overdoseLethalThreshold = 1.6
	#Health points drained per tick during a severe (lethal-threshold) overdose unconsciousness. Tuned so a single severe dose-stack (drug load ~2.0) drains a full-health player before the load decays back below the lethal threshold, yet leaves time for naloxone to reverse it.
	#Range: 0.0 ~ 20.0
	overdoseLethalDrainPerTick = 0.05
	#Drug load at/above which an overdose can trigger asphyxia. Keep it at or below the substance overdose threshold (default 1.0 = morphine's) so the overdose that crosses it is eligible; raising it means only heavier overshoots asphyxiate. A severe overdose (>= overdoseLethalThreshold) always skips asphyxia and blacks out immediately.
	#Range: 0.0 ~ 100.0
	asphyxiaThreshold = 1.0
	#Probability (0..1) that crossing the asphyxia threshold on an injection triggers asphyxia instead of an immediate overdose unconsciousness.
	#Range: 0.0 ~ 1.0
	asphyxiaChance = 0.35
	#Air supply units drained per tick while asphyxiating (vanilla max air is 300). Higher = a faster suffocation; net drain also has to overcome vanilla's on-land air regen.
	#Range: 1 ~ 300
	asphyxiaAirLossPerTick = 12
	#Ticks after passing out from asphyxia before it turns FATAL. If the cause is not cleared in this window (surface / reverse the drug), the player dies. Default 200 (10 seconds).
	#Range: 1 ~ 72000
	asphyxiaUnconsciousTicks = 200
	#Amplifier of the Weakness effect applied while asphyxiating (0 = Weakness I, 1 = Weakness II, ...).
	#Range: 0 ~ 9
	asphyxiaWeaknessAmplifier = 1
	#If true, any real damage taken while already unconscious/downed finishes the player (they can be killed while helpless). If false, a downed player is immune to further combat damage and can only die from the bleed-out timer.
	finishDownedOnHit = true
	#Chance (0..1) that a bare-handed PUNCH to the torso or head produces a minor internal bleed (major trauma) instead of just a bruise. Punches to any other limb are always just bruising. Default 0.15.
	#Range: 0.0 ~ 1.0
	unarmedMajorChance = 0.15
	#If true, high pain makes the local player's aim drift/tremble (harder to aim). Client-side.
	painSwayEnabled = true
	#Multiplier on the pain aim-sway amplitude (0 = off, 1 = default, higher = shakier).
	#Range: 0.0 ~ 5.0
	painSwayStrength = 1.0
	#Aim-sway intensity (0..1) forced while aiming a bow / crossbow / TACZ gun with a broken arm: a broken arm cannot hold a weapon steady, and ADS does not brace it away. 1.0 = full sway. Default 0.9.
	#Range: 0.0 ~ 1.0
	brokenArmAimSway = 0.9
	#Weakness effect level applied to a player with a broken arm, weakening their MELEE attacks. 1 = Weakness I, 2 = Weakness II, etc.; 0 = disabled. Default 1.
	#Range: 0 ~ 10
	brokenArmMeleeWeaknessLevel = 1
	#Movement-speed bonus fraction added at FULL stimulant strength (0.30 = +30% speed). A combat stimulant also overrides injury slowdown and clears the jump penalty while active.
	#Range: 0.0 ~ 5.0
	stimulantSpeedBonus = 0.3
	#How much a FULL clotting boost raises the wound severity that can self-clot without a bandage, ADDED to bleedingSelfHealThreshold (0.70 -> a full boost lets even a severe bleed close on its own). Default 0.70.
	#Range: 0.0 ~ 1.0
	clottingBoostThresholdBonus = 0.7
	#How much FASTER a boosted wound self-clots: the self-heal rate is multiplied by (1 + clottingBoost * this). 10.0 -> up to 11x the normal clot speed at full boost. Default 10.0.
	#Range: 0.0 ~ 100.0
	clottingBoostRateMultiplier = 10.0
	#How long (ticks) the clotting boost from a hemostatic BOOST_CLOTTING item lasts (20 ticks = 1 second). Default 2400 (2 minutes).
	#Range: 1 ~ 72000
	clottingAgentDurationTicks = 2400
	#Ticks a player consciously struggles for air (heavily slowed, blurred) once asphyxia begins, before passing out. Clearing the cause in this window recovers cleanly. Default 60 (3 seconds).
	#Range: 1 ~ 12000
	asphyxiaStruggleTicks = 60
	#Movement-speed multiplier while consciously asphyxiating (heavy constraint). Sprint and jump are also blocked. Default 0.25 = a quarter speed.
	#Range: 0.0 ~ 1.0
	asphyxiaMoveMultiplier = 0.25
	#How long (ticks) after being damaged by a player that a subsequent bleed-out / engine death is still credited to that player (20 ticks = 1 second). Vanilla forgets an attacker after 100 ticks, so this must be long enough to cover a full bleed-out. Default 6000 (5 minutes).
	#Range: 0 ~ 432000
	deathAttributionWindowTicks = 6000

	#MAJOR TRAUMA (instant death): a hit kills outright -- before it could become a survivable
	#unconsciousness -- when its damage reaches this fraction of the player's FULL healthy health
	#bar (maxHealthHearts) AND the medical armor model did not BLOCK it. Per damage category so a
	#sniper, a blast and a fall tune apart; categories without their own entry use
	#majorTraumaFractionDefault. Fire/chemical/radiation never instant-kill on impact (they are
	#damage-over-time). Set an entry high (e.g. 100) to effectively disable instant death for it.
	[balance.lethality]
		#Default fraction for categories without a specific entry (melee slashing, piercing, generic).
		#Range: 0.1 ~ 100.0
		majorTraumaFractionDefault = 1.0
		#Firearms/bullets -- a full healthy bar's worth of bullet in one hit kills outright.
		#Range: 0.1 ~ 100.0
		majorTraumaFractionBallistic = 1.5
		#Blasts.
		#Range: 0.1 ~ 100.0
		majorTraumaFractionExplosion = 0.9
		#Heavy impact/crushing (falling blocks, anvils, wall slams).
		#Range: 0.1 ~ 100.0
		majorTraumaFractionBlunt = 1.1
		#Bare-handed strikes -- set high so punches essentially never one-shot.
		#Range: 0.1 ~ 100.0
		majorTraumaFractionUnarmed = 3.0
		#Falls -- 1.0 means a fall dealing a full health bar (~33 blocks) instant-kills; shorter falls crush/fracture legs and can bleed you out instead.
		#Range: 0.1 ~ 100.0
		majorTraumaFractionFall = 0.7

[pain]
	#Per-limb pain diminishing-returns constant. A limb's LOCAL pain (0..1) = raw / (raw + k): a smaller k saturates a limb's pain faster, a larger k needs more/worse wounds on the SAME limb to approach that limb's share cap. Default 1.0.
	#Range: 0.05 ~ 20.0
	painSaturationK = 1.0
	#Max SHARE of total pain (0..1) a fully-painful HEAD can contribute to the SYSTEMIC pain that drives shock / unconsciousness. Per-limb shares are caps and may sum ABOVE 1.0 (the total is clamped), so COMBINATIONS cause shock while no single limb can. Default 0.35.
	#Range: 0.0 ~ 1.0
	painShareHead = 0.35
	#Max SHARE of total pain (0..1) a fully-painful TORSO can contribute. The torso carries most of the shock-inducing weight; at the default it sits just under the shock threshold, so torso trauma plus one more injury tips into shock. Default 0.50.
	#Range: 0.0 ~ 1.0
	painShareTorso = 0.5
	#Max SHARE of total pain (0..1) a fully-painful ARM can contribute (per arm). Deliberately small: an agonising arm still hurts (aim sway / screen effects) but cannot, by itself, put you into shock. Default 0.10.
	#Range: 0.0 ~ 1.0
	painShareArm = 0.1
	#Max SHARE of total pain (0..1) a fully-painful LEG can contribute (per leg). Femoral trauma is genuinely shock-grade, so legs weigh more than arms. Default 0.20.
	#Range: 0.0 ~ 1.0
	painShareLeg = 0.2
	#Max SHARE of the FULL health bar a fully-destroyed HEAD can remove from the life pool. Per-limb CAPS so one limb can never drain the whole pool; a limb that reaches its cap is 'drained' (disabled + fractured) and further damage overflows into bleeding. Default 0.35.
	#Range: 0.0 ~ 1.0
	healthShareHead = 0.35
	#Max SHARE of the FULL health bar a fully-destroyed TORSO can remove. The torso carries most of the life pool. Default 0.55.
	#Range: 0.0 ~ 1.0
	healthShareTorso = 0.55
	#Max SHARE of the FULL health bar a fully-destroyed ARM can remove (per arm). Small: an arm cannot cost your life directly, but a drained arm is disabled and overflows into bleeding. Default 0.12.
	#Range: 0.0 ~ 1.0
	healthShareArm = 0.12
	#Max SHARE of the FULL health bar a fully-destroyed LEG can remove (per leg). A drained leg is disabled; both legs drained forces a crawl. Default 0.18.
	#Range: 0.0 ~ 1.0
	healthShareLeg = 0.18
	#Multiplier applied to a limb's bleeding while a TOURNIQUET is on it (arms/legs only). Lower = a tourniquet slows blood loss more; it never fully stops it and does NOT treat the underlying wound (remove it and full bleeding returns). Default 0.20.
	#Range: 0.0 ~ 1.0
	tourniquetBleedMultiplier = 0.2
	#Movement multiplier applied PER LEG wearing a tourniquet (0.85 = 15% slower per leg) so leaving them on permanently is discouraged. Default 0.85.
	#Range: 0.0 ~ 1.0
	tourniquetLegSpeedMultiplier = 0.85
	#Movement multiplier applied PER ARM wearing a tourniquet (minor). Default 0.95.
	#Range: 0.0 ~ 1.0
	tourniquetArmSpeedMultiplier = 0.95
	#Weapon-sway intensity floor (0..1, like pain sway) while ANY arm wears a tourniquet. Default 0.30.
	#Range: 0.0 ~ 1.0
	tourniquetArmSway = 0.3
	#If true, a PURELY pain-driven knockout (one that blood loss alone would not cause) is held off for adrenalinePainKoDelayTicks, mimicking adrenaline: the player keeps their feet through the pain before finally collapsing. Blood-loss knockouts are never delayed.
	adrenalineEnabled = true
	#Ticks a pain-driven knockout is delayed by adrenaline once pain reaches knockout level (20 ticks = 1 second). If pain drops below that level within the window, adrenaline recharges and the timer resets. Default 120 (6 seconds).
	#Range: 0 ~ 12000
	adrenalinePainKoDelayTicks = 120
	#Chance (0..1) that removing a tourniquet recovers it back into the remover's inventory. On success the tourniquet item is returned (dropped at their feet if there is no room); on failure it is lost. Default 0.60.
	#Range: 0.0 ~ 1.0
	tourniquetRecoveryChance = 0.6

[hitlocation]
	#Master switch. If true, incoming hits are mapped to a limb by projecting the reconstructed hit position onto the victim's body geometry (deterministic). Off -> legacy weighted random sampler everywhere.
	geometricHitLocation = true
	#If true, a victim actively aiming/using a weapon reassigns frontal-upper hits to the raised arm instead of the torso.
	poseAwareArms = true
	#Fraction (0..1) of body height, measured from the feet, at/above which a hit counts as the head.
	#Range: 0.0 ~ 1.0
	headBandBottom = 0.74
	#Fraction (0..1) of body height, measured from the feet, at/below which a hit counts as a leg.
	#Range: 0.0 ~ 1.0
	legBandTop = 0.4
	#Normalized horizontal offset (|nx|, 0..1 of the box half-width) at/above which a torso-height hit is redirected to an arm.
	#Range: 0.0 ~ 1.0
	armSideThreshold = 0.8
	#Melee aim-ray length in blocks used when reconstructing the geometric hit location for melee attacks.
	#Range: 0.0 ~ 8.0
	meleeReach = 3.0
	#If true, hits on players are classified against a server-side replica of the humanoid pose (six oriented limb boxes posed as the renderer would pose them), so aiming/crouch/swing arm positions are exact. Off -> fall back to the banded-AABB hit location.
	riggedLimbBoxes = true
	#Amount (in blocks) each rigged limb box is inflated to absorb pose-replica drift versus vanilla/mod animations.
	#Range: 0.0 ~ 0.5
	limbBoxPadding = 0.02
	#DEBUG/TEST tool. If true, the rigged limb boxes become live-tunable: use
	#'/wfmedical hitbox set|add <limb> <field> <value>' to nudge each box's position/size (in
	#model units, 1/16 block) while watching the hitbox overlay (K key), then bake the dialled-in
	#numbers back into HumanoidRig.BASE with '/wfmedical hitbox export'. Off (the default) has ZERO
	#runtime cost -- the boxes are built straight from their fixed base spec, no tuning applied.
	#The '/wfmedical hitbox debug on|off' command flips this live for a session without a reload.
	hitboxDebug = false
	#DEBUG/TEST tool. If true, every TACZ bullet's own broad-phase collision test is compared
	#against the rig's per-limb OBBs for nearby players and logged: whether TACZ itself registered
	#a hit, and whether the rig would have classified a limb for that same ray. A 'HITBOX GAP'
	#warning is logged whenever a shot would land on a rig limb box but TACZ's own collision test
	#missed it entirely (so no damage/hurt event ever fired). Off (the default) has ZERO runtime cost.
	logHitDetection = false

[compat]
	#If true and Open Persistence is installed, a player's persistent logout body carries their medical profile: it inherits their trauma on logout, accrues new trauma when hit while they are offline, and the (possibly worse) state is restored to the player on login. The body keeps vanilla health while offline -- there is no live physiology/bleed-out tick on it.
	openPersistenceCompat = true
	#If true and TACZ is installed, a player holding a TACZ gun poses the rig's arms with the baked TACZ third-person hold/ADS pose (driven by the gun's SYNCED aiming progress) instead of the generic raised-forward approximation, so arm hits while aiming a gun land correctly.
	taczArmPose = true

[hitregistration]
	#How incoming attacks are registered against players / persistent bodies:
	#  OFF      - vanilla: the ray clips the tight collision box; arms (which render outside
	#             it) and prone bodies never register.
	#  ENVELOPE - the hit-scan box is widened by a fixed margin (hitEnvelopeReach*) so arm /
	#             prone hits register (forgiving: a shot through the gap between an arm and the
	#             torso still counts). Near-zero cost; collision/physics are unaffected.
	#  PRECISE  - ENVELOPE registration, then a shot that actually threaded a gap between the
	#             rigged limb boxes is rejected (whiffs). A centre-mass hit is a cheap tight-box
	#             fast-path, so only grazing arm-margin shots ever build the rig.
	#Allowed Values: OFF, ENVELOPE, PRECISE
	hitRegistrationMode = "ENVELOPE"

	#Per-STANCE broad-phase envelope: blocks the hit-scan box is widened for each pose so arm /
	#prone hits register. Horizontal = X/Z per side, Vertical = Y top+bottom. Size each to just
	#contain the model in that stance -- the vanilla box already shrinks while crouching/swimming,
	#and the fine-phase per-limb test rejects any surplus, so over-sizing only costs a few extra
	#fine tests while under-sizing drops hits. Tune live with '/wfmedical hitbox envelope ...' and
	#bake the dialled-in numbers back here.
	[hitregistration.envelopeReach]
		#Horizontal (X/Z) envelope reach for the standing stance.
		#Range: 0.0 ~ 4.0
		standingHorizontal = 0.4
		#Vertical (Y) envelope reach for the standing stance.
		#Range: 0.0 ~ 4.0
		standingVertical = 0.2
		#Horizontal (X/Z) envelope reach for the crouching stance.
		#Range: 0.0 ~ 4.0
		crouchingHorizontal = 0.5
		#Vertical (Y) envelope reach for the crouching stance.
		#Range: 0.0 ~ 4.0
		crouchingVertical = 0.1
		#Horizontal (X/Z) envelope reach for the prone stance.
		#Range: 0.0 ~ 4.0
		proneHorizontal = 1.0
		#Vertical (Y) envelope reach for the prone stance.
		#Range: 0.0 ~ 4.0
		proneVertical = 0.3
		#Horizontal (X/Z) envelope reach for the downed stance.
		#Range: 0.0 ~ 4.0
		downedHorizontal = 1.0
		#Vertical (Y) envelope reach for the downed stance.
		#Range: 0.0 ~ 4.0
		downedVertical = 0.3

#Who computes the posed limb rig used to classify a player hit. Purely a performance /
#authority trade -- the medical outcome is identical either way.
#  SERVER      - the server rebuilds the victim's rig itself (authoritative, deterministic).
#                Backed by a per-tick cache so repeated hits in one tick cost one rebuild.
#  CLIENT_HINT - the victim's client streams its own posed rig; the server still runs the ray
#                test ITSELF (an attacker can never pick the limb) but skips the costly rebuild,
#                validating the supplied pose against a cheap bound and falling back to a server
#                rebuild whenever the hint is absent, stale, or implausible. Trades a little
#                per-player bandwidth for server CPU on very large servers.
[authority]
	#SERVER (default, authoritative) or CLIENT_HINT (victim streams its pose; server validates).
	#Allowed Values: SERVER, CLIENT_HINT
	hitAuthority = "SERVER"
	#CLIENT_HINT only: the victim's client will not send its pose more often than this many ticks, even while moving (rate limit). Default 2.
	#Range: 1 ~ 40
	poseStreamMinIntervalTicks = 2
	#CLIENT_HINT only: the victim's client resends its pose at least this often even when it has not changed (heartbeat), so the server's copy never goes stale under poseHintMaxAgeTicks. Keep below poseHintMaxAgeTicks. Default 10.
	#Range: 1 ~ 200
	poseStreamMaxIntervalTicks = 10
	#CLIENT_HINT only: the server treats a streamed pose older than this (in ticks) as stale and rebuilds the rig itself for that hit. Default 30 (1.5s).
	#Range: 1 ~ 200
	poseHintMaxAgeTicks = 30
	#CLIENT_HINT only: slack (blocks) added to the victim's bounding box when validating a streamed pose. A supplied limb box whose centre falls outside the box+margin (or whose size is implausible) is rejected and the server rebuilds instead. Guards against a client shrinking/displacing its own hitboxes. Default 0.6.
	#Range: 0.0 ~ 4.0
	poseHintMargin = 0.6
	#Animation-aware hitboxes (PlayerAnimator compat). When ON, a player's limb hitboxes track
	#played animations for HIT REGISTRATION -- not just the client visual. PlayerAnimator applies
	#animations client-side only, so the animated pose reaches the server via the SAME validated
	#pose-stream path as CLIENT_HINT: the victim streams its own posed rig, the server still runs
	#the ray test ITSELF and validates the pose (an attacker can never pick the limb). This turns
	#on pose streaming even under SERVER authority, so it carries the same client-trust caveat as
	#CLIENT_HINT. OFF (default): animations are a client-side visual only; hits use the server's
	#vanilla-pose rebuild. PlayerAnimator itself is NOT required on the server.
	animatedHitboxes = false
	#Client-pose streaming sensitivity: the victim resends its pose once any limb-box scalar
	#(position or orientation) drifts more than this many blocks from the last sent pose. Lower =
	#small rotations reach the server sooner (finer tracking) for a little more bandwidth; higher =
	#coarser, small movements ignored. Default 0.0002.
	#Range: 0.0 ~ 1.0
	poseStreamChangeEpsilon = 2.0E-4

#PENETRATION (through-and-through): when on, a traced shot can wound EVERY rigged limb box it
#passes through (e.g. a raised arm AND the torso behind it), not just the nearest. The nearest
#limb is still the PRIMARY hit (full damage, can be lethal, identical to penetration-off); each
#further limb the shot exits into takes a declining share of trauma and never instant-kills.
#Only ray-like sources (bullets, arrows, melee aim) penetrate; explosions / positional hits do
#not. Off (default) is byte-identical to the single-limb behaviour.
[penetration]
	#Master toggle for through-and-through multi-limb wounding.
	penetrationEnabled = false
	#How much limb resistance one shot can punch through. As the ray crosses each limb it spends that limb's penetrationResist*; once the budget is used up the shot stops and no deeper limb is wounded. The first (nearest) limb is always hit regardless of budget. Default 1.0.
	#Range: 0.0 ~ 10.0
	penetrationBudget = 1.0
	#Trauma-energy multiplier applied per limb already pierced: limb N gets energy * falloff^N. 0.5 -> the second limb takes half, the third a quarter, etc. Default 0.5.
	#Range: 0.0 ~ 1.0
	penetrationEnergyFalloff = 0.5
	#Penetration resistance of the HEAD (budget spent passing through it).
	#Range: 0.0 ~ 10.0
	penetrationResistHead = 0.5
	#Penetration resistance of the TORSO (dense -> stops a shot soonest).
	#Range: 0.0 ~ 10.0
	penetrationResistTorso = 0.8
	#Penetration resistance of an ARM (thin -> a shot passes through readily).
	#Range: 0.0 ~ 10.0
	penetrationResistArm = 0.25
	#Penetration resistance of a LEG.
	#Range: 0.0 ~ 10.0
	penetrationResistLeg = 0.4

[unconsciousness]
	#Short 'adrenaline-style' grace (ticks) the player stays conscious, resisting, before a DRUG blackout takes hold (20 ticks = 1 second); also ADDED on top of the asphyxia struggle window before passing out. Much shorter than the pain adrenaline delay. Once this grace is running the temporary blackout is SEALED – an antidote no longer PREVENTS it (it only strips the drug/buffs, prevents death, and speeds the wake-up roll). Surfacing still ends a drowning episode during the conscious struggle. 0 = black out immediately. Default 30 (1.5 seconds).
	#Range: 0 ~ 12000
	blackoutGraceTicks = 30
	#Probability (0..1) PER physiology recompute that an unconscious player WAKES UP, rolled only once their wakeup score has dropped to wakeupScoreThreshold or below. Higher = they come to sooner (at the default 10-tick update interval, 0.15 averages ~3-4 seconds once eligible). Default 0.15.
	#Range: 0.0 ~ 1.0
	wakeChance = 0.15
	#An unconscious player may only START rolling wakeChance once their WAKEUP SCORE is at or below this. The score is a weighted sum of how bad their blood loss, pain, drug load and active bleeding still are (each normalised 0..1, then multiplied by its weight below); low = stabilised. Injuries need not fully stop, just be low. A single fully-KO-grade factor (weight 1) sits at 1.0, so the default 0.5 requires the causes to be well eased. Default 0.5.
	#Range: 0.0 ~ 40.0
	wakeupScoreThreshold = 0.5
	#Weight of BLOOD LOSS in the wakeup score (blood lost / bloodUnconsciousLossFraction, clamped 0..1 -> 1.0 at the pass-out loss). Higher = heavy blood loss keeps the player down longer; this is what stops a still-bleeding-out player from waking. Default 1.0.
	#Range: 0.0 ~ 20.0
	wakeupBloodWeight = 1.0
	#Weight of systemic PAIN in the wakeup score (0 below painShockThreshold, 1.0 at painUnconsciousThreshold). Default 1.0.
	#Range: 0.0 ~ 20.0
	wakeupPainWeight = 1.0
	#Weight of DRUG LOAD in the wakeup score (load / overdoseLethalThreshold, clamped 0..1). Keeps an overdosed player under until the drug wears down. Default 1.0.
	#Range: 0.0 ~ 20.0
	wakeupDrugWeight = 1.0
	#Weight of ACTIVE BLEEDING RATE in the wakeup score (rate / wakeupBleedReference, clamped 0..1). Distinct from blood-loss: a player barely bled yet but haemorrhaging fast should not wake. Default 1.0.
	#Range: 0.0 ~ 20.0
	wakeupBleedWeight = 1.0
	#Bleeding rate (ml/tick) treated as a 'full' (1.0) bleed contribution to the wakeup score; the actual aggregate bleeding is divided by this and clamped to 1. Lower = even light bleeding keeps the player down. Default 2.0.
	#Range: 0.01 ~ 1000.0
	wakeupBleedReference = 2.0

